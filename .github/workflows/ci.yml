name: Tests and security checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile Python source
        run: python -m compileall -q .
      - name: Run regression suite
        run: python -m pytest -q
      - name: Verify signed audit entries
        env:
          AUDIT_SECRET_KEY: "ci-test-secret-not-for-production"
        run: |
          python -c "from agents.base import AuditLogger; AuditLogger.log('ci','test','CHECK',{'ok': True}); assert AuditLogger.verify_integrity()"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test browser scoring and static page syntax
        run: node --test tests/test_browser_score.cjs
